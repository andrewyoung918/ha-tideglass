    - grid_options:
        columns: full
        rows: auto
      type: custom:button-card
      template: coast_panel
      custom_fields:
        body:
          card:
            type: markdown
            content: |-
              Tide heights are NOAA predictions relative to **mean lower low water (MLLW)**. Wind and weather can change actual water levels.

              [National Weather Service](https://forecast.weather.gov/MapClick.php?lat=42.05&lon=-70.18) · [NOAA tide table](https://tidesandcurrents.noaa.gov/noaatidepredictions.html?id=8446121)
      styles:
        card:
        - padding: 8px
  - type: grid
    cards:
    - grid_options:
        columns: full
        rows: auto
      type: custom:button-card
      template: coast_panel
      custom_fields:
        body: |-
          [[[
          const a = entity?.attributes || {};
          const valid = entity && !['unknown','unavailable'].includes(entity.state) && Array.isArray(a.tides);
          const title = '<div class="eyebrow">Seven days of tides</div><div class="serif" style="font-size:28px;margin:5px 0 24px">Plan around the water</div>';
          if (!valid) return title + '<div class="muted">Tide predictions are unavailable. Tideglass will retry automatically.</div>';
          const tz = {timeZone:'America/New_York'};
          const unit = ['ft','m'].includes(a.height_unit) ? a.height_unit : '';
          const groups = new Map();
          for (const tide of a.tides) {
            if (!['high','low'].includes(tide.type) || Number.isNaN(Date.parse(tide.time))) continue;
            const d = new Date(tide.time);
            const key = d.toLocaleDateString('en-CA',tz);
            if (!groups.has(key)) groups.set(key,{date:d,low:[],high:[]});
            groups.get(key)[tide.type].push(tide);
          }
          const cell = (tides,kind) => {
            const color = kind === 'low' ? '#73dbc7' : '#efd19a';
            const items = tides.map(t => {
              const time = new Date(t.time).toLocaleTimeString('en-US',{...tz,hour:'numeric',minute:'2-digit'});
              const h = t.height !== null && t.height !== '' && Number.isFinite(Number(t.height)) ? `${Number(t.height).toFixed(2)} ${unit}` : 'Height unavailable';
              return `<div style="display:flex;justify-content:space-between;gap:6px;align-items:baseline;margin-top:7px;flex-wrap:wrap"><span style="font-size:14px;white-space:nowrap">${time}</span><span class="muted" style="font-size:11px;white-space:nowrap">${h}</span></div>`;
            }).join('');
            return `<div><div style="color:${color};font-size:10px;letter-spacing:1.7px;text-transform:uppercase">${kind === 'low' ? '↓ Low' : '↑ High'}</div>${items || '<div class="muted" style="margin-top:7px">—</div>'}</div>`;
          };
          const rows = [...groups.values()].map(day => `<div class="week-row"><div><div style="font-size:16px">${day.date.toLocaleDateString('en-US',{...tz,weekday:'long'})}</div><div class="muted" style="font-size:11px;margin-top:5px">${day.date.toLocaleDateString('en-US',{...tz,month:'short',day:'numeric'})}</div></div><div class="week-tides">${cell(day.low,'low')}${cell(day.high,'high')}</div></div>`).join('');
          return title + (rows || '<div class="muted">No tide events are available for this week.</div>') + '<div class="muted" style="font-size:11px;margin-top:18px">Provincetown local time · Heights above MLLW · Tap for the full data</div>';
          ]]]
      entity: sensor.provincetown_tideglass_week
      tap_action:
        action: more-info
      extra_styles: |2

        .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 2.3px; text-transform: uppercase; color: #73dbc7; line-height: 1.6; }
        .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; letter-spacing: -.7px; }
        .muted { color: #91abb5; }
        .metric { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #b9cdd2; }
        .metric ha-icon { margin: 0; flex-shrink: 0; width: 16px; height: 16px; color: #73dbc7; }

        .week-row {display:grid;grid-template-columns:125px minmax(0,1fr);gap:18px;padding:20px 0;border-top:1px solid #283e4a;}
        .week-tides {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;}
        @media(max-width:600px) {.week-row {grid-template-columns:1fr;gap:15px;}.week-tides {gap:18px;}}
    column_span: 2
- title: Wind
  path: wind
  type: sections
  max_columns: 2
  dense_section_placement: false
  background:
    image: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%228%22%20height%3D%228%22%3E%3Cpath%20fill%3D%22%230b1720%22%20d%3D%22M0%200h8v8H0z%22/%3E%3C/svg%3E
    opacity: 100
    size: cover
    attachment: fixed
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      template: coast_panel
      grid_options:
        columns: full
        rows: auto
      custom_fields:
        body: |-
          <div class="eyebrow">Provincetown / Wind</div><div class="serif" style="font-size:29px;line-height:1.2;margin-top:4px">Read the breeze.</div>
      styles:
        card:
        - background: transparent
        - border: '0'
        - box-shadow: none
        - padding: 2px 4px 6px
    column_span: 2
  - type: grid
    cards:
    - type: custom:button-card
      template: coast_panel
      grid_options:
        columns: full
        rows: auto
      custom_fields:
        body: |-
          [[[
          const number=v=>v!==null && v!==undefined && String(v).trim()!=='' && Number.isFinite(Number(v));
          const w=states['weather.coast_weather'];
          const a=w?.attributes||{};
          const stamp=Date.parse(states['sensor.coast_weather_time']?.state);
          const stale=Number.isFinite(stamp)&&Date.now()-stamp>3600000;
          const ok=w&&!['unknown','unavailable'].includes(w.state)&&!stale;
          const unit=['mph','km/h','m/s','kn'].includes(a.wind_speed_unit)?a.wind_speed_unit:'';
          const bearing=ok && number(a.wind_bearing)?(Number(a.wind_bearing)%360+360)%360:null;
          const direction=bearing!==null?['N','NE','E','SE','S','SW','W','NW'][Math.round(bearing/45)%8]:'—';
          const speed=ok && number(a.wind_speed)?Math.round(Number(a.wind_speed)):'—';
          const gust=ok && number(a.wind_gust_speed)?`${Math.round(Number(a.wind_gust_speed))} ${unit}`:'—';
          const pressure=ok && number(a.pressure)?`${Number(a.pressure).toFixed(a.pressure_unit==='inHg'?2:0)} ${['inHg','hPa','mbar','Pa','kPa','mmHg'].includes(a.pressure_unit)?a.pressure_unit:''}`:'—';
          const when=Number.isFinite(stamp)?new Date(stamp).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}):null;
          const note=stale?'Forecast update delayed · Check Pirate Weather':when?`Pirate Weather · ${when}`:'Pirate Weather · Forecast time unavailable';
          return `<div class="eyebrow">Local wind / Now</div><div style="display:flex;gap:22px;align-items:center;justify-content:space-between;margin-top:9px"><div><span class="serif" style="font-size:58px;line-height:1">${speed}</span><span class="muted" style="font-size:22px;margin-left:7px">${unit}</span><div style="font-size:15px;margin-top:5px">${bearing!==null?'From '+direction:'Direction unavailable'}</div></div><div style="width:83px;height:83px;border:1px solid #36515c;border-radius:50%;display:grid;place-items:center;position:relative;flex-shrink:0"><span class="muted" style="font-size:9px;position:absolute;top:6px">N</span><ha-icon icon="mdi:arrow-up" style="margin:0;width:32px;height:32px;color:#efd19a;transform:rotate(${bearing??0}deg);opacity:${bearing!==null?1:.2}"></ha-icon></div></div><div class="divider compact-grid"><div><div class="compact-label">Gusts</div><div class="compact-value">${gust}</div></div><div><div class="compact-label">From</div><div class="compact-value">${bearing!==null?Math.round(bearing)+'°':'—'}</div></div><div><div class="compact-label">Pressure</div><div class="compact-value">${pressure}</div></div></div><div style="font-size:10px;color:${stale?'#efd19a':'#91abb5'};margin-top:14px">${note}</div>`;

          ]]]
      update_timer: 60000
      tap_action:
        action: more-info
        entity: weather.coast_weather
    column_span: 2
  - type: grid
    cards:
    - grid_options:
        columns: full
        rows: auto
      type: custom:button-card
      template: coast_panel
      custom_fields:
        heading: <div class="eyebrow">Windy / Forecast map</div><div class="serif" style="font-size:24px;margin-top:4px">Wind
          over the Cape</div>
        body:
          card:
            type: iframe
            url: https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=in&metricTemp=%C2%B0F&metricWind=mph&zoom=8&overlay=wind&product=ecmwf&level=surface&lat=42.05&lon=-70.18&marker=true
            aspect_ratio: 70%
      styles:
        card:
        - padding: 20px 12px 12px
        grid:
        - grid-template-areas: '"heading" "body"'
        - row-gap: 14px
        custom_fields:
          heading:
          - text-align: left
          - white-space: normal
    column_span: 2
