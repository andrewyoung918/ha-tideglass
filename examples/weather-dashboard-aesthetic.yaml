title: Coast
button_card_templates:
  coast_panel:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
      - background: '#101f2b'
      - border: '1px solid #283e4a'
      - border-radius: 22px
      - box-shadow: 0 8px 32px rgba(0,0,0,0.10)
      - padding: 18px
      - color: '#edf5f2'
      - font-family: var(--primary-font-family)
      - font-size: 14px
      - --primary-text-color: '#edf5f2'
      - --secondary-text-color: '#91abb5'
      - --primary-color: '#73dbc7'
      - --accent-color: '#efd19a'
      - --light-primary-color: '#73dbc7'
      - --text-light-primary-color: '#0b1720'
      - --ha-card-background: '#101f2b'
      - --card-background-color: '#101f2b'
      - --ha-card-border-width: '0'
      - --ha-card-box-shadow: none
      - --ha-card-border-radius: 16px
      - --divider-color: '#283e4a'
      - --secondary-background-color: '#19303d'
      - --paper-item-icon-color: '#73dbc7'
      - --fc-border-color: '#283e4a'
      - --fc-list-event-hover-bg-color: '#193c45'
      - --fc-today-bg-color: '#193c45'
      - --fc-neutral-bg-color: '#19303d'
      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: minmax(0, 1fr)
      - grid-template-rows: min-content
      custom_fields:
        body:
        - white-space: normal
        - text-align: left
        - width: 100%
        - min-width: '0'
    grid_options:
      columns: full
      rows: auto
    extra_styles: |2

      .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 2.3px; text-transform: uppercase; color: #73dbc7; line-height: 1.6; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; letter-spacing: -.7px; }
      .muted { color: #91abb5; }
      .metric { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #b9cdd2; }
      .metric ha-icon { margin: 0; flex-shrink: 0; width: 16px; height: 16px; color: #73dbc7; }

      .compact-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: #91abb5; line-height: 1.4; }
      .compact-value { margin-top: 4px; font-size: 16px; color: #edf5f2; line-height: 1.3; }
      .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .card-top ha-icon { margin: 0; width: 18px; height: 18px; color: #91abb5; }
      .compact-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
      .divider { border-top: 1px solid #283e4a; margin-top: 14px; padding-top: 12px; }
views:
- title: Summary
  path: coast
  type: sections
  max_columns: 2
  dense_section_placement: false
  background:
    image: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%228%22%20height%3D%228%22%3E%3Cpath%20fill%3D%22%230b1720%22%20d%3D%22M0%200h8v8H0z%22/%3E%3C/svg%3E
    opacity: 100
    size: cover
    attachment: fixed
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      template: coast_panel
      grid_options:
        columns: full
        rows: auto
      custom_fields:
        body: |-
          <div class="eyebrow">Tideglass / Provincetown</div><div class="serif" style="font-size:29px;line-height:1.2;margin-top:4px">At a glance.</div>
      styles:
        card:
        - background: transparent
        - border: '0'
        - box-shadow: none
        - padding: 2px 4px 6px
    column_span: 2
  - type: grid
    cards:
    - type: custom:button-card
      template: coast_panel
      grid_options:
        columns: full
        rows: auto
      custom_fields:
        body: |-
          [[[
          const safe = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const available = s => s && s.state !== '' && !['unknown','unavailable','none','None'].includes(s.state);
          const number = v => v !== null && v !== undefined && String(v).trim() !== '' && Number.isFinite(Number(v));
          const w = states['weather.coast_weather'];
          const stamp = Date.parse(states['sensor.coast_weather_time']?.state);
          const stale = Number.isFinite(stamp) && Date.now()-stamp > 3600000;
          const ok = available(w) && !stale;
          const a = w?.attributes || {};
          const conditions = {'clear-night':'Clear night','cloudy':'Cloudy','exceptional':'Exceptional weather','fog':'Fog','hail':'Hail','lightning':'Thunderstorms','lightning-rainy':'Thunderstorms','partlycloudy':'Partly cloudy','pouring':'Heavy rain','rainy':'Rain','snowy':'Snow','snowy-rainy':'Wintry mix','sunny':'Sunny','windy':'Windy','windy-variant':'Windy'};
          const icons = {'clear-night':'weather-night','cloudy':'weather-cloudy','fog':'weather-fog','hail':'weather-hail','lightning':'weather-lightning','lightning-rainy':'weather-lightning-rainy','partlycloudy':'weather-partly-cloudy','pouring':'weather-pouring','rainy':'weather-rainy','snowy':'weather-snowy','snowy-rainy':'weather-snowy-rainy','sunny':'weather-sunny','windy':'weather-windy','windy-variant':'weather-windy-variant'};
          const unit = ['°F','°C'].includes(a.temperature_unit) ? a.temperature_unit : '°';
          const temp = ok && number(a.temperature) ? Math.round(Number(a.temperature)) : '—';
          const feels = ok && number(a.apparent_temperature) ? `Feels like ${Math.round(Number(a.apparent_temperature))}${unit}` : 'Feels like unavailable';
          const rain = states['sensor.coast_weather_minutely_summary'];
          const summary = stale ? 'Waiting for a fresh forecast' : available(rain) ? safe(rain.state) : 'Rain outlook unavailable';
          const chance = states['sensor.coast_weather_precip_probability'];
          const pct = !stale && available(chance) && number(chance.state) && Number(chance.state)>=0 && Number(chance.state)<=100 ? `${Math.round(Number(chance.state))}%` : '—';
          const windUnit = ['mph','km/h','m/s','kn'].includes(a.wind_speed_unit) ? a.wind_speed_unit : '';
          const bearing = number(a.wind_bearing) ? ['N','NE','E','SE','S','SW','W','NW'][(Math.round(Number(a.wind_bearing)/45)%8+8)%8] : '';
          const wind = ok && number(a.wind_speed) ? `${Math.round(Number(a.wind_speed))} ${windUnit}` : '—';
          const humidity = ok && number(a.humidity) ? `${Math.round(Number(a.humidity))}%` : '—';
          const metric=(label,val)=>`<div><div class="compact-label">${label}</div><div class="compact-value">${val}</div></div>`;
          return `<div class="card-top"><div class="eyebrow">Weather / Now</div><ha-icon icon="mdi:arrow-top-right"></ha-icon></div>
          <div style="display:flex;align-items:center;gap:13px;margin-top:12px"><div class="serif" style="font-size:54px;line-height:1">${temp}<span style="font-size:23px;color:#91abb5">${unit}</span></div><div style="flex:1"><div style="font-size:17px">${ok ? conditions[w.state] || 'Weather' : stale ? 'Update delayed' : 'Unavailable'}</div><div class="muted" style="font-size:12px;margin-top:5px">${feels}</div></div><ha-icon icon="mdi:${ok ? icons[w.state] || 'weather-cloudy' : 'weather-cloudy-alert'}" style="margin:0;width:39px;height:39px;flex-shrink:0;color:#efd19a"></ha-icon></div>
          <div class="divider"><div class="compact-label">The next hour</div><div class="serif" style="font-size:20px;line-height:1.3;margin-top:5px;color:${stale?'#efd19a':'#edf5f2'}">${summary}</div></div>
          <div class="compact-grid" style="margin-top:14px">${metric('Rain chance',pct)}${metric(ok && bearing ? `Wind · ${bearing}` : 'Wind',wind)}${metric('Humidity',humidity)}</div>`;

          ]]]
      update_timer: 60000
      tap_action:
        action: navigate
        navigation_path: /dashboard-coast/weather
  - type: grid
    cards:
    - type: custom:button-card
      template: coast_panel
      grid_options:
        columns: full
        rows: auto
      custom_fields:
        body: |-
          [[[
          const get = suffix => states['sensor.provincetown_tideglass_'+suffix];
          const available = s => s && s.state !== '' && !['unknown','unavailable','none','None'].includes(s.state);
          const number = s => available(s) && Number.isFinite(Number(s.state));
          const status = get('prediction_status')?.state;
          const ok = ['fresh','cached'].includes(status);
          const direction = get('tide_direction')?.state;
          const heading = ok && direction==='rising' ? 'The tide is rising' : ok && direction==='falling' ? 'The tide is falling' : 'Tide outlook unavailable';
          const tz={timeZone:'America/New_York'};
          const fmtTime = s => ok && available(s) && Number.isFinite(Date.parse(s.state)) ? new Date(s.state).toLocaleTimeString('en-US',{...tz,hour:'numeric',minute:'2-digit'}) : '—';
          const fmtDate = s => ok && available(s) && Number.isFinite(Date.parse(s.state)) ? new Date(s.state).toLocaleDateString('en-US',{...tz,weekday:'short',month:'short',day:'numeric'}) : 'Unavailable';
          const height = s => ok && number(s) ? `${Number(s.state).toFixed(2)} ${['ft','m'].includes(s.attributes.unit_of_measurement) ? s.attributes.unit_of_measurement : ''}` : '—';
          const event = (kind,color) => `<div><div class="compact-label" style="color:${color}">Next ${kind}</div><div class="serif" style="font-size:27px;line-height:1.15;margin-top:6px;white-space:nowrap">${fmtTime(get('next_'+kind+'_time'))}</div><div class="muted" style="font-size:11px;margin-top:4px">${fmtDate(get('next_'+kind+'_time'))}</div><div style="color:${color};font-size:14px;margin-top:7px">${height(get('next_'+kind+'_height'))}<span class="muted" style="font-size:9px;margin-left:4px">MLLW</span></div></div>`;
          const recent=get('most_recent_tide')?.state;
          const recentLabel=recent==='low'?'Low':recent==='high'?'High':'Tide';
          const footer=status==='cached'?'Stored NOAA predictions · reconnecting':!ok?'Waiting for NOAA predictions':`${recentLabel} at ${fmtTime(get('most_recent_tide_time'))} · Predicted now ${height(get('predicted_height'))}`;
          return `<div class="card-top"><div class="eyebrow">Tides / Harbor</div><ha-icon icon="mdi:arrow-top-right"></ha-icon></div><div class="serif" style="font-size:24px;line-height:1.25;margin-top:11px">${heading}</div><div class="divider" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${event('high','#efd19a')}${event('low','#73dbc7')}</div><div style="font-size:10px;line-height:1.5;color:${status==='fresh'?'#91abb5':'#efd19a'};margin-top:14px">${footer}</div>`;

          ]]]
      update_timer: 60000
      tap_action:
        action: navigate
        navigation_path: /dashboard-coast/tides
  - type: grid
    cards:
    - type: custom:button-card
      template: coast_panel
      grid_options:
        columns: full
        rows: auto
      custom_fields:
        body: |-
          [[[
          const safe = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const s = states['sensor.coast_weather_hourly_summary'];
          const stamp=Date.parse(states['sensor.coast_weather_time']?.state);
          const stale=Number.isFinite(stamp) && Date.now()-stamp>3600000;
          const text=stale?'Forecast update delayed':s && s.state && !['unknown','unavailable','None','none'].includes(s.state)?safe(s.state):'Forecast outlook unavailable';
          return `<div style="display:flex;align-items:center;gap:15px"><ha-icon icon="mdi:weather-partly-cloudy" style="margin:0;width:27px;height:27px;flex-shrink:0;color:#efd19a"></ha-icon><div style="flex:1"><div class="eyebrow">Looking ahead</div><div style="font-size:15px;line-height:1.45;margin-top:3px;color:${stale?'#efd19a':'#edf5f2'}">${text}</div></div><ha-icon icon="mdi:chevron-right" style="margin:0;width:19px;height:19px;flex-shrink:0;color:#91abb5"></ha-icon></div>`;

          ]]]
      update_timer: 60000
      tap_action:
        action: navigate
        navigation_path: /dashboard-coast/weather
    column_span: 2
- title: Weather
  path: weather
  type: sections
  max_columns: 2
  dense_section_placement: false
  background:
    image: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%228%22%20height%3D%228%22%3E%3Cpath%20fill%3D%22%230b1720%22%20d%3D%22M0%200h8v8H0z%22/%3E%3C/svg%3E
    opacity: 100
    size: cover
    attachment: fixed
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      template: coast_panel
      grid_options:
        columns: full
        rows: auto
      custom_fields:
        body: |-
          <div class="eyebrow">Provincetown / Pirate Weather</div><div class="serif" style="font-size:29px;line-height:1.2;margin-top:4px">The weather ahead.</div>
      styles:
        card:
        - background: transparent
        - border: '0'
        - box-shadow: none
        - padding: 2px 4px 6px
    column_span: 2
  - type: grid
    cards:
    - grid_options:
        columns: full
        rows: auto
      type: custom:button-card
      template: coast_panel
      custom_fields:
        body: |-
          [[[
          const a = entity?.attributes || {};
          const ok = entity && !['unavailable','unknown'].includes(entity.state);
          const number = value => value !== null && value !== undefined && value !== '' && Number.isFinite(Number(value));
          const temp = ok && number(a.temperature) ? Math.round(Number(a.temperature)) : '—';
          const unit = a.temperature_unit === '°C' ? '°C' : a.temperature_unit === '°F' ? '°F' : '°';
          const conditions = {'clear-night':'Clear night','cloudy':'Cloudy','exceptional':'Exceptional weather','fog':'Fog','hail':'Hail','lightning':'Thunderstorms','lightning-rainy':'Thunderstorms','partlycloudy':'Partly cloudy','pouring':'Heavy rain','rainy':'Rain','snowy':'Snow','snowy-rainy':'Wintry mix','sunny':'Sunny','windy':'Windy','windy-variant':'Windy'};
          const icons = {'clear-night':'weather-night','cloudy':'weather-cloudy','fog':'weather-fog','hail':'weather-hail','lightning':'weather-lightning','lightning-rainy':'weather-lightning-rainy','partlycloudy':'weather-partly-cloudy','pouring':'weather-pouring','rainy':'weather-rainy','snowy':'weather-snowy','snowy-rainy':'weather-snowy-rainy','sunny':'weather-sunny','windy':'weather-windy','windy-variant':'weather-windy-variant'};
          const condition = ok ? (conditions[entity.state] || 'Weather') : 'Weather unavailable';
          const windUnit = ['mph','km/h','m/s','kn'].includes(a.wind_speed_unit) ? a.wind_speed_unit : '';
          const speed = ok && number(a.wind_speed) ? `${Math.round(Number(a.wind_speed))} ${windUnit}` : '—';
          const bearing = number(a.wind_bearing) ? ['N','NE','E','SE','S','SW','W','NW'][Math.round(Number(a.wind_bearing)/45)%8] : '';
          const humidity = ok && number(a.humidity) ? `${Math.round(Number(a.humidity))}%` : '—';
          return `<div class="eyebrow">Right now · Provincetown</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin:15px 0 8px">
          <div><span class="serif" style="font-size:78px;line-height:1">${temp}</span><span style="font-size:27px;color:#91abb5;vertical-align:top;margin-left:3px">${unit}</span></div>
          <ha-icon icon="mdi:${icons[entity?.state] || 'weather-cloudy-alert'}" style="margin:0;flex-shrink:0;width:66px;height:66px;color:#efd19a;opacity:.95"></ha-icon></div>
          <div class="serif" style="font-size:26px">${condition}</div>
          <div style="display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid #283e4a;padding-top:18px;margin-top:22px">
          <div class="metric"><ha-icon icon="mdi:weather-windy"></ha-icon>${speed} ${ok ? bearing : ''}</div>
          <div class="metric"><ha-icon icon="mdi:water-percent"></ha-icon>${humidity} humidity</div></div>
          <div class="muted" style="font-size:10px;letter-spacing:.7px;margin-top:20px">PIRATE WEATHER · PROVINCETOWN</div>`;
          ]]]
      entity: weather.coast_weather
      tap_action:
        action: more-info
    - type: custom:button-card
      template: coast_panel
      update_timer: 60000
      grid_options:
        columns: full
        rows: auto
      tap_action:
        action: more-info
        entity: sensor.coast_weather_minutely_summary
      triggers_update:
      - sensor.coast_weather_precip_probability
      - sensor.coast_weather_precip_intensity
      - sensor.coast_weather_apparent_temperature
      - sensor.coast_weather_uv_index
      - sensor.coast_weather_time
      custom_fields:
        body: |-
          [[[
          const safe = v => String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const available = s => s && s.state !== '' && !['unknown','unavailable','none','None'].includes(s.state);
          const numeric = s => !stale && available(s) && Number.isFinite(Number(s.state));
          const s = states['sensor.coast_weather_minutely_summary'];
          const chance = states['sensor.coast_weather_precip_probability'];
          const intensity = states['sensor.coast_weather_precip_intensity'];
          const feels = states['sensor.coast_weather_apparent_temperature'];
          const uv = states['sensor.coast_weather_uv_index'];
          const time = states['sensor.coast_weather_time'];
          const stamp = available(time) ? Date.parse(time.state) : NaN;
          const stale = Number.isFinite(stamp) && Date.now()-stamp > 3600000;
          const summary = stale ? 'Waiting for a fresh rain forecast' : available(s) ? safe(s.state) : 'Rain outlook unavailable';
          const metric = (label,value) => `<div><div class="muted" style="font-size:10px;letter-spacing:1px;text-transform:uppercase">${label}</div><div style="font-size:19px;margin-top:6px">${value}</div></div>`;
          const numberWithUnit = (s,digits) => numeric(s) ? `${Number(s.state).toFixed(digits)} <span style="font-size:12px;color:#91abb5">${safe(s.attributes.unit_of_measurement || '')}</span>` : '—';
          const percent = numeric(chance) && Number(chance.state)>=0 && Number(chance.state)<=100 ? `${Math.round(Number(chance.state))}%` : '—';
          const when = Number.isFinite(stamp) ? new Date(stamp).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}) : null;
          const note = stale ? 'Forecast update delayed · Check Pirate Weather' : when ? `Forecast time ${when} · Refreshes every 15 minutes` : 'Forecast time unavailable · Check Pirate Weather';
          return `<div class="eyebrow">Rain / The next 60 minutes</div><div class="serif" style="font-size:25px;line-height:1.25;margin:14px 0 22px">${summary}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px;border-top:1px solid #283e4a;padding-top:18px">${metric('Current chance',percent)}${metric('Current rate',numberWithUnit(intensity,3))}${metric('Feels like',numberWithUnit(feels,0))}${metric('UV index',numberWithUnit(uv,1))}</div><div style="font-size:10px;line-height:1.5;color:${stale?'#efd19a':'#91abb5'};margin-top:20px">${note}</div>`;
          ]]]
  - type: grid
    cards:
    - grid_options:
        columns: full
        rows: auto
      type: custom:button-card
      template: coast_panel
      custom_fields:
        heading: <div class="eyebrow">A little further out</div><div class="serif" style="font-size:28px;margin-top:5px">The
          hours ahead</div>
        body:
          card:
            type: custom:clock-weather-card
            entity: weather.coast_weather
            sun_entity: sun.sun
            weather_icon_type: line
            animated_icon: false
            forecast_rows: 6
            locale: en-US
            time_format: 12
            time_pattern: h a
            hide_today_section: true
            hourly_forecast: true
            time_zone: America/New_York
            show_decimal: false
      styles:
        card:
        - padding: 20px
        grid:
        - grid-template-areas: '"heading" "body"'
        - row-gap: 14px
        custom_fields:
          heading:
          - text-align: left
          - white-space: normal
    - grid_options:
        columns: full
        rows: auto
      type: custom:button-card
      template: coast_panel
      custom_fields:
        heading: <div class="eyebrow">Pirate Weather / Daily forecast</div><div class="serif" style="font-size:28px;margin-top:5px">The
          week ahead</div>
        body:
          card:
            type: custom:clock-weather-card
            entity: weather.coast_weather
            sun_entity: sun.sun
            weather_icon_type: line
            animated_icon: false
            forecast_rows: 5
            locale: en-US
            time_format: 12
            time_pattern: h a
            hide_today_section: true
            hourly_forecast: false
            time_zone: America/New_York
            show_decimal: false
      styles:
        card:
        - padding: 20px
        grid:
        - grid-template-areas: '"heading" "body"'
        - row-gap: 14px
        custom_fields:
          heading:
          - text-align: left
          - white-space: normal
  - type: grid
    cards:
    - grid_options:
        columns: full
        rows: auto
      type: custom:button-card
      template: coast_panel
      custom_fields:
        heading: <div class="eyebrow">Live radar / Windy</div><div class="serif" style="font-size:24px;margin-top:4px">Rain
          on the horizon</div>
        body:
          card:
            type: iframe
            url: https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=in&metricTemp=%C2%B0F&metricWind=mph&zoom=8&overlay=radar&product=radar&level=surface&lat=42.05&lon=-70.18&marker=true
            aspect_ratio: 60%
      styles:
        card:
        - padding: 20px 12px 12px
        grid:
        - grid-template-areas: '"heading" "body"'
        - row-gap: 14px
        custom_fields:
          heading:
          - text-align: left
          - white-space: normal
    column_span: 2
- title: Tides
  path: tides
  type: sections
  max_columns: 2
  dense_section_placement: false
  background:
    image: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%228%22%20height%3D%228%22%3E%3Cpath%20fill%3D%22%230b1720%22%20d%3D%22M0%200h8v8H0z%22/%3E%3C/svg%3E
    opacity: 100
    size: cover
    attachment: fixed
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      template: coast_panel
      grid_options:
        columns: full
        rows: auto
      custom_fields:
        body: |-
          <div class="eyebrow">Provincetown / NOAA 8446121</div><div class="serif" style="font-size:29px;line-height:1.2;margin-top:4px">Follow the water.</div>
      styles:
        card:
        - background: transparent
        - border: '0'
        - box-shadow: none
        - padding: 2px 4px 6px
    column_span: 2
  - type: grid
    cards:
    - type: custom:tideglass-card
      entity: sensor.provincetown_tideglass_week
      weather_entity: weather.coast_weather
      grid_options:
